name: Vite Ci
on:
  push:
    branches: ["main"]
    paths:
      - "VoxPopuli/src/**"
      - "VoxPopuli/public/**"
      - "VoxPopuli/package.json"
      - "VoxPopuli/vite.config.ts"
      - "VoxPopuli/tsconfig.json"
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VoxPopuli/package-lock.json

      - name: Install dependencies
        working-directory: VoxPopuli
        run: npm ci
      - name: Build Vite app
        working-directory: VoxPopuli
        run: npm run build
