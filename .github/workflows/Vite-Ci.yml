name: Vite Ci
on:
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VoxPopuli/ppackage-lock.json

      - name: Install dependencies
        working-directory: VoxPopuli
        run: npm ci
      - name: Build Vite app
        run: npm run build
