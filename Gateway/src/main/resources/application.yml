server:
  port: 8080

spring:
  application:
    name: edge-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                  allowed-origins: "*"
                  allowed-methods:
                    - GET
                    - POST
                    - PUT
                    - DELETE
                    - OPTIONS
                  allowed-headers: "*"

      
          routes:
            - id: auth-service
              uri: http://auth-service:8080
              predicates:
                - Path=/api/v1/auth/**
              filters:
                #- name: OriginFilter
                #  args:
                #    acceptedId: "chromeExtensionIdNotHardcodedHereButInEnvironmentalVariables"
                - StripPrefix=2
      
            - id: comment-service
              uri: http://comment-service:8080
              predicates:
                - Path=/api/v1/comments/**
              filters:
                - name: OriginFilter
                  args:
                    acceptedId: "chromeExtensionIdNotHardcodedHereButInEnvironmentalVariables"
                - StripPrefix=2
                - name: AuthFilter

gateway:
  auth:
    session-service-url: http://session-service:8080
