services:
  userservice:
    build: .
    container_name: userservice
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - userservice-db

  userservice-db:
    image: postgres:16
    container_name: userservice-db
    restart: always
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
